<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admission Popup Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #020b1f;
        --panel: #061a3d;
        --panel-deep: #031431;
        --blue: #2563eb;
        --blue-soft: #60a5fa;
        --orange: #f97316;
        --text: #f8fafc;
        --muted: #a8bad8;
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--navy);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        background: #020b1f;
      }

      .backdrop::before,
      .backdrop::after {
        content: "";
        position: absolute;
        border: 1px solid rgba(37, 99, 235, 0.2);
        border-radius: 999px;
      }

      .backdrop::before { width: 680px; height: 680px; left: -210px; top: -250px; }
      .backdrop::after { width: 520px; height: 520px; right: -170px; bottom: -220px; }

      .modal {
        position: relative;
        z-index: 1;
        width: min(100%, 520px);
        border: 1px solid rgba(96, 165, 250, 0.75);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25), 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 38px rgba(37, 99, 235, 0.28);
        overflow: hidden;
      }

      .modal-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 94px;
        padding: 18px 24px;
        border-bottom: 1px solid rgba(96, 165, 250, 0.2);
        background: var(--panel-deep);
      }

      .logo-crop {
        width: 184px;
        height: 52px;
        overflow: hidden;
        border-radius: 10px;
      }

      .logo-crop img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
      }

      .close {
        width: 36px;
        height: 36px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 50%;
        background: transparent;
        color: #cbd5e1;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }

      .close:hover { border-color: var(--blue-soft); color: white; }

      .content { padding: 28px 30px 30px; }

      .eyebrow {
        display: inline-flex;
        margin-bottom: 10px;
        padding: 7px 13px;
        border: 1px solid rgba(249, 115, 22, 0.55);
        border-radius: 999px;
        color: #fed7aa;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); line-height: 1.08; }
      .intro { margin: 12px 0 24px; color: var(--muted); font-size: 15px; line-height: 1.6; }

      .field { display: grid; gap: 8px; margin-bottom: 16px; }
      label { color: #e2e8f0; font-size: 13px; font-weight: 700; }
      input, select {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgba(96, 165, 250, 0.55);
        border-radius: 12px;
        outline: none;
        padding: 0 15px;
        background: #04132f;
        color: white;
        font: inherit;
      }
      input::placeholder { color: #7085a6; }
      input:focus, select:focus { border-color: var(--blue-soft); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); }

      .submit {
        width: 100%;
        min-height: 54px;
        margin-top: 7px;
        border: 1px solid #fdba74;
        border-radius: 13px;
        background: var(--orange);
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 14px 26px rgba(249, 115, 22, 0.26);
      }
      .submit:hover { background: #ea580c; }
      .note { margin: 15px 0 0; text-align: center; color: #94a3b8; font-size: 12px; }

      @media (max-width: 520px) {
        body { padding: 12px; }
        .modal-top { padding: 15px 18px; }
        .content { padding: 23px 20px 24px; }
        .logo-crop { width: 164px; }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="modal" role="dialog" aria-modal="true" aria-labelledby="admission-title">
      <header class="modal-top">
        <div class="logo-crop"><img src="/new-logo.webp" alt="Badam Singh Classes" /></div>
        <button class="close" type="button" aria-label="Close preview">×</button>
      </header>
      <section class="content">
        <div class="eyebrow">ADMISSION OPEN</div>
        <h1 id="admission-title">Start your preparation with expert guidance</h1>
        <p class="intro">Share your details and our academic team will help you choose the right batch.</p>
        <form>
          <div class="field"><label for="name">Full name</label><input id="name" placeholder="Enter your full name" /></div>
          <div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="Enter your email address" /></div>
          <div class="field"><label for="mobile">Mobile number</label><input id="mobile" inputmode="tel" placeholder="Enter your mobile number" /></div>
          <div class="field"><label for="exam">Select your exam</label><select id="exam"><option value="">Choose an exam</option><option>SSC CGL</option><option>SSC CHSL</option><option>MP Police</option><option>State Exam</option></select></div>
          <button class="submit" type="button">Send enquiry</button>
        </form>
        <p class="note">We’ll contact you shortly.</p>
      </section>
    </main>
  </body>
</html>
